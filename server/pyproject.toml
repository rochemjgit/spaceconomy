[project]
name = "spaceconomy-server"
version = "0.1.0"
description = "Authoritative realtime server for Spaceconomy"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.128.0",
  "uvicorn[standard]>=0.40.0",
  "pydantic-settings>=2.12.0",
  "sqlalchemy[asyncio]>=2.0.45",
  "asyncpg>=0.31.0",
  "alembic>=1.17.0",
  "redis>=7.0.0",
  "argon2-cffi>=25.1.0",
  "pyjwt>=2.10.0",
  "msgpack>=1.1.0",
]

[tool.setuptools]
packages = ["spaceconomy"]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0",
  "mypy>=1.15.0,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["spaceconomy"]
